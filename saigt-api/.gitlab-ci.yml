# Pipeline do saigt-api: gate de testes nos merge requests, build da imagem e publicação no registry nos ramos
# develop, staging e master, e deploy manual da imagem publicada no ambiente de cada ramo.
# Os jobs testes, imagem e publicar precisam de um runner com executor docker em modo privilegiado e o volume
# /certs/client (Docker-in-Docker com TLS); os de deploy só de um cliente SSH.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Ramos de longa duração: sempre pipeline de ramo, mesmo com um MR de promoção aberto (develop → staging).
    - if: $CI_COMMIT_BRANCH =~ /^(develop|staging|master)$/
    # Um ramo com MR aberto corre só o pipeline do MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: never

stages:
  - testes
  - imagem
  - deploy

default:
  interruptible: true

variables:
  SAIGT_IMPLEMENTATION_REF:
    value: master
    description: "Ramo ou tag do saigt-implementation com os mappings dos simuladores (incm-mock, snit-mock) usados pelo job testes."

# Docker-in-Docker com TLS, como recomenda a documentação do GitLab. Versão fixa: o mesmo número na imagem e no serviço.
.docker-dind:
  services:
    - name: docker:29.9.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"

# Maven da imagem (a mesma da fase de build do Dockerfile), com o repositório local dentro do projeto para a cache.
.maven:
  image: maven:3.9-eclipse-temurin-21
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    MAVEN_CLI_OPTS: "-B --no-transfer-progress"
    # Os contentores do Testcontainers correm no serviço dind: as portas mapeadas estão no host "docker".
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository

# Suite completa: unitários, @SpringBootTest em H2 (perfil test) e Testcontainers (PostgreSQL, RustFS e os
# simuladores WireMock da INCM e do SNIT, com os mappings da pasta irmã ../saigt-implementation).
testes:
  stage: testes
  extends:
    - .docker-dind
    - .maven
  # O CI_JOB_TOKEN só lê o saigt-implementation (allowlist do job token nesse projeto). Sem set -x nem echo do URL:
  # leva o token. A pasta irmã fica no volume de builds do runner entre jobs, por isso apaga-se antes do clone.
  before_script:
    - rm -rf ../saigt-implementation
    - git clone --quiet --depth 1 --branch "$SAIGT_IMPLEMENTATION_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/saigt-implementation.git" ../saigt-implementation
    - git -C ../saigt-implementation remote remove origin
    - git -C ../saigt-implementation log -1 --format="saigt-implementation $SAIGT_IMPLEMENTATION_REF %h %s"
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: target/surefire-reports/TEST-*.xml

.imagem:
  stage: imagem
  extends: .docker-dind
  image: docker:29.9.2
  needs:
    - job: testes
      artifacts: false

# Merge requests: confirma que o Dockerfile constrói. Sem login nem push: o código por integrar não chega ao
# registry e as credenciais não ficam ao alcance dos ramos de feature.
imagem:
  extends: .imagem
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build -t "saigt-api:$CI_COMMIT_SHORT_SHA" .

# Pipelines de ramo de develop, staging e master: publica a imagem com a etiqueta do commit, a referência imutável
# do deploy. O registry e as credenciais vêm das variáveis de CI/CD (as predefinidas do Container Registry do
# GitLab, ou as do projeto com os mesmos nomes, protegidas e mascaradas, para outro registry).
publicar:
  extends: .imagem
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^(develop|staging|master)$/
  variables:
    IMAGEM: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - '[ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_IMAGE" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] || { echo "Faltam variáveis de CI/CD do registry (CI_REGISTRY, CI_REGISTRY_IMAGE, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD)."; exit 1; }'
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # A etiqueta de um commit nunca se sobrescreve: num pipeline repetido, ou com o mesmo commit promovido a
    # staging ou master, fica a imagem que já lá está.
    - if docker manifest inspect "$IMAGEM" > /dev/null 2>&1; then echo "A imagem $IMAGEM já está no registry; não se sobrescreve."; exit 0; fi
    - docker build -t "$IMAGEM" .
    - docker push "$IMAGEM"

# Deploy num ambiente: cada ambiente tem, num servidor, o seu docker-compose.yml e o seu .env com os segredos de
# runtime, geridos fora dos repositórios. O job liga-se por SSH à pasta do ambiente, indica a imagem nova do saigt-api
# (na variável SAIGT_API_IMAGEM, só no ambiente do comando), faz pull e up -d só desse serviço e espera que fique
# saudável. Nunca escreve no .env nem lê os valores das credenciais da base de dados: a migração Liquibase corre no
# arranque do saigt-api, com as credenciais do dono que o ambiente lhe dá. Endereços, pasta, chave e known_hosts vêm de
# variáveis de CI/CD com o âmbito do ambiente; o registry e as credenciais do pull, das mesmas variáveis do publicar.
.deploy:
  stage: deploy
  image: docker:29.9.2
  needs:
    - job: publicar
      artifacts: false
  # Um deploy a meio não se cancela com um push mais recente.
  interruptible: false
  variables:
    SERVICO: saigt-api
    VARIAVEL_IMAGEM: SAIGT_API_IMAGEM
    IMAGEM: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Valores por omissão; uma variável de CI/CD com o mesmo nome (do ambiente) sobrepõe-se.
    DEPLOY_SSH_PORT: "22"
    DEPLOY_TEMPO_LIMITE: "300"
    DEPLOY_LINHAS_LOG: "100"
  before_script:
    - '[ -n "$DEPLOY_SSH_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] && [ -n "$DEPLOY_DIR" ] && [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] || { echo "Faltam variáveis de CI/CD do ambiente $CI_ENVIRONMENT_NAME (DEPLOY_SSH_HOST, DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS, DEPLOY_DIR) ou do registry (CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD)."; exit 1; }'
    - '[ -f "$DEPLOY_SSH_KEY" ] && [ -f "$DEPLOY_SSH_KNOWN_HOSTS" ] || { echo "DEPLOY_SSH_KEY e DEPLOY_SSH_KNOWN_HOSTS têm de ser variáveis de CI/CD do tipo File."; exit 1; }'
    # A chave do host do ambiente é sempre verificada contra o known_hosts da variável (StrictHostKeyChecking=yes).
    - install -d -m 700 "$HOME/.ssh" && tr -d '\r' < "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy" && chmod 600 "$HOME/.ssh/deploy" && tr -d '\r' < "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
    - |
      remoto() {
        ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
          -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy" -p "$DEPLOY_SSH_PORT" "$DEPLOY_SSH_HOST" "$@"
      }
      aspas() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"; }
      # Corre na pasta do ambiente o script lido do stdin.
      no_ambiente() {
        remoto "cd $(aspas "$DEPLOY_DIR") && export $VARIAVEL_IMAGEM=$(aspas "$IMAGEM") IMAGEM_ESPERADA=$(aspas "$IMAGEM") SERVICO=$(aspas "$SERVICO") LINHAS_LOG=$(aspas "$DEPLOY_LINHAS_LOG") && sh -s"
      }
      # Quantas das seis credenciais da base de dados o serviço recebe com valor (só a contagem sai do servidor).
      CONTAR_CREDENCIAIS='docker compose config --format json "$SERVICO" | grep -oE "\"SPRING_(DATASOURCE|LIQUIBASE)_(URL|USERNAME|PASSWORD)\": *\"[^\"]" | wc -l'
      # Estado dos contentores do serviço: ok, espera ou «falha: <motivo>». Um contentor parado ou a reiniciar falha logo.
      VERIFICAR='
      ids=$(docker compose ps -a -q "$SERVICO")
      [ -n "$ids" ] || { echo "falha: não há contentores do $SERVICO"; exit 0; }
      res=ok
      for c in $ids; do
        set -- $(docker inspect --format "{{.Name}} {{.Config.Image}} {{.State.Status}} {{.RestartCount}} {{if .State.Health}}{{.State.Health.Status}}{{else}}nenhum{{end}}" "$c")
        if [ "$2" != "$IMAGEM_ESPERADA" ]; then echo "falha: $1 corre $2"; exit 0; fi
        if [ "$3" != running ] || [ "$4" != 0 ]; then echo "falha: $1 está $3, com $4 reinícios"; exit 0; fi
        case "$5" in
          healthy) ;;
          unhealthy) echo "falha: $1 ficou unhealthy"; exit 0 ;;
          nenhum) echo "falha: $1 não tem healthcheck no docker-compose.yml do ambiente"; exit 0 ;;
          *) res=espera ;;
        esac
      done
      echo "$res"
      '
      RESUMO='
      for c in $(docker compose ps -q "$SERVICO"); do
        echo "$(docker inspect --format "{{.Name}} {{.Config.Image}} {{.State.Health.Status}}" "$c") /actuator/health: $(docker exec "$c" wget -q -O - http://127.0.0.1:8080/actuator/health)"
      done
      '
      LOGS='docker compose logs --no-color --tail "$LINHAS_LOG" "$SERVICO"'
  script:
    - echo "Deploy de $IMAGEM ($SERVICO) no ambiente $CI_ENVIRONMENT_NAME."
    # O saigt-api tem de receber do ambiente as credenciais do dono (SPRING_LIQUIBASE_*) e as do runtime
    # (SPRING_DATASOURCE_*), nunca os valores por omissão de desenvolvimento do application.properties.
    - |
      n=$(printf '%s\n' "$CONTAR_CREDENCIAIS" | no_ambiente | tr -dc '0-9')
      [ "${n:-0}" -eq 6 ] || { echo "O ambiente $CI_ENVIRONMENT_NAME não dá ao $SERVICO as seis variáveis SPRING_DATASOURCE_* e SPRING_LIQUIBASE_* com valor (tem ${n:-0}). Nada mudou no ambiente."; exit 1; }
    # Login no registry pelo stdin, no servidor do ambiente, e logout logo a seguir ao pull.
    - printf '%s' "$CI_REGISTRY_PASSWORD" | remoto "docker login --username $(aspas "$CI_REGISTRY_USER") --password-stdin $(aspas "$CI_REGISTRY")"
    - |
      rc=0
      echo 'docker compose pull --quiet "$SERVICO"' | no_ambiente || rc=$?
      remoto "docker logout $(aspas "$CI_REGISTRY")" > /dev/null || true
      [ "$rc" -eq 0 ] || { echo "O pull de $IMAGEM falhou. Nada mudou no ambiente."; exit 1; }
    # Recria sempre o serviço, também com a mesma imagem: repetir o deploy volta a arrancar o saigt-api e a migração.
    - echo 'docker compose up -d --no-deps --force-recreate "$SERVICO"' | no_ambiente
    - |
      inicio=$(date +%s); motivo=""
      while :; do
        estado=$(printf '%s\n' "$VERIFICAR" | no_ambiente) || estado="espera (SSH falhou)"
        decorrido=$(( $(date +%s) - inicio ))
        case "$estado" in
          ok) break ;;
          falha*) motivo=${estado#falha: }; break ;;
        esac
        if [ "$decorrido" -ge "$DEPLOY_TEMPO_LIMITE" ]; then motivo="passaram ${DEPLOY_TEMPO_LIMITE}s sem o $SERVICO ficar saudável ($estado)"; break; fi
        sleep 5
      done
      if [ -n "$motivo" ]; then
        echo "Deploy falhou ao fim de ${decorrido}s: $motivo. Últimas $DEPLOY_LINHAS_LOG linhas do log do $SERVICO:"
        printf '%s\n' "$LOGS" | no_ambiente || true
        exit 1
      fi
      echo "O $SERVICO ficou saudável ao fim de ${decorrido}s no ambiente $CI_ENVIRONMENT_NAME:"
      printf '%s\n' "$RESUMO" | no_ambiente

# Um job manual por ambiente, só nos pipelines de ramo e só em ramos protegidos (as variáveis protegidas do ambiente só
# chegam aí): develop → desenvolvimento, staging → qualidade, master → produção. O nome do ambiente no GitLab é a
# chave das variáveis com âmbito de ambiente; o endereço vem da variável DEPLOY_URL desse ambiente.
deploy-desenvolvimento:
  extends: .deploy
  resource_group: deploy-desenvolvimento
  environment:
    name: desenvolvimento
    url: $DEPLOY_URL
    deployment_tier: development
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"
      when: manual

deploy-qualidade:
  extends: .deploy
  resource_group: deploy-qualidade
  environment:
    name: qualidade
    url: $DEPLOY_URL
    deployment_tier: staging
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "staging"
      when: manual

deploy-producao:
  extends: .deploy
  resource_group: deploy-producao
  environment:
    name: producao
    url: $DEPLOY_URL
    deployment_tier: production
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "master"
      when: manual
