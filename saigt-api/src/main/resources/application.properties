spring.application.name=saigt-api
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saigt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:saigt_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase corre com o role owner (DDL/grants) — o runtime JPA acima usa saigt_app,
# restrito, para que a imutabilidade da auditoria (§11, issue #19) seja real. Ver
# docker/postgres/init/01-init.sql.
spring.liquibase.change-log=classpath:db/master.xml
spring.liquibase.url=${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:5432/saigt}
spring.liquibase.user=${SPRING_LIQUIBASE_USERNAME:saigt}
spring.liquibase.password=${SPRING_LIQUIBASE_PASSWORD:saigt}

# JWKS do servidor de autorização embutido (o próprio saigt-api). Lido no primeiro token a validar, não no arranque.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URI:http://localhost:8080/oauth2/jwks}
app.security.auth-disabled=${AUTH_DISABLED:false}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# TLS termina no ingress/reverse proxy — confiar em X-Forwarded-* para que
# isSecure() (HSTS, issue #31 AC5) e getRemoteAddr() (auditoria.ip_origem,
# issue #31 AC7) reflitam o pedido original do cliente, não o do proxy.
server.forward-headers-strategy=framework

# Rate limiting por utilizador/entidade (sub do JWT) ou IP se anónimo (§9). Limites distintos: auth
# (POST /oauth2/token e POST /oauth2/revoke, por IP; alvo de força bruta) mais restritivo do que api (negócio, e o
# GET /oauth2/jwks por IP). "configs" (não "instances") — os filtros criam uma instância dinâmica por chave a partir
# destas, via RateLimiterRegistry.rateLimiter(nome, configName).
resilience4j.ratelimiter.configs.auth.limit-for-period=${APP_RATE_LIMIT_AUTH_LIMIT:20}
resilience4j.ratelimiter.configs.auth.limit-refresh-period=${APP_RATE_LIMIT_AUTH_REFRESH:1m}
resilience4j.ratelimiter.configs.auth.timeout-duration=0
resilience4j.ratelimiter.configs.api.limit-for-period=${APP_RATE_LIMIT_API_LIMIT:300}
resilience4j.ratelimiter.configs.api.limit-refresh-period=${APP_RATE_LIMIT_API_REFRESH:1m}
resilience4j.ratelimiter.configs.api.timeout-duration=0
# Links publicos da INCM e da PCGT (BL-DOC-029): pedidos por IP, na cadeia publica.
resilience4j.ratelimiter.configs.publico.limit-for-period=${APP_RATE_LIMIT_PUBLICO_LIMIT:60}
resilience4j.ratelimiter.configs.publico.limit-refresh-period=${APP_RATE_LIMIT_PUBLICO_REFRESH:1m}
resilience4j.ratelimiter.configs.publico.timeout-duration=0
# Pedidos do SNIT por cliente (BL-DOC-029: 120/min), em /api/v1/integracoes/snit/.
resilience4j.ratelimiter.configs.snit.limit-for-period=${APP_RATE_LIMIT_SNIT_LIMIT:120}
resilience4j.ratelimiter.configs.snit.limit-refresh-period=${APP_RATE_LIMIT_SNIT_REFRESH:1m}
resilience4j.ratelimiter.configs.snit.timeout-duration=0

app.jwt.issuer=${JWT_ISSUER:https://auth.saigt.pt}
app.jwt.audience=${JWT_AUDIENCE:saigt-api}
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-hours=8
# Clientes OAuth de sistema (client credentials em /oauth2/token). Credenciais próprias de cada ambiente, entregues
# pela DGT; só A-Z a-z 0-9 - . _. Sem as duas variáveis de um sistema, esse cliente não é registado.
app.oauth.clientes.snit.client-id=${SAIGT_OAUTH_SNIT_CLIENT_ID:}
app.oauth.clientes.snit.client-secret=${SAIGT_OAUTH_SNIT_CLIENT_SECRET:}
app.oauth.clientes.geoconform.client-id=${SAIGT_OAUTH_GEOCONFORM_CLIENT_ID:}
app.oauth.clientes.geoconform.client-secret=${SAIGT_OAUTH_GEOCONFORM_CLIENT_SECRET:}
# Token de pré-autenticação do seletor de entidade INCM — 2 a 5 min (§8.1, issue #25).
app.jwt.pre-auth-token-ttl-minutes=${JWT_PRE_AUTH_TTL_MINUTES:5}
# Cliente OAuth público do saigt-ui: sem segredo (nunca há segredos no browser), só o identificador.
app.oauth.ui.client-id=${SAIGT_OAUTH_UI_CLIENT_ID:saigt-ui}

# Username AD (nome de autenticação, ex.: ana.silva) do primeiro MASTER, semeado se não houver nenhum.
app.admin.email-arranque=${ADMIN_ARRANQUE_EMAIL:}

# Purga periodica de sessoes fechadas ou expiradas, incluindo pre-autenticacao
# abandonada no seletor (issue #83) - as 3h diariamente por omissao.
app.sessao.purga.cron=${APP_SESSAO_PURGA_CRON:0 0 3 * * *}
# Duracao maxima do lock: se a instancia morrer a meio, outra pode correr o job depois deste tempo.
app.sessao.purga.lock-maximo=${APP_SESSAO_PURGA_LOCK_MAXIMO:15m}

app.ldap.url=${LDAP_URL:}
app.ldap.base-dn=${LDAP_BASE_DN:}
# Principal do bind do grant ad-password; {0} é o username: UPN ({0}@dominio), nome simples ({0}) ou um DN.
app.ldap.bind-format=${LDAP_BIND_FORMAT:{0}}

# Mock de login LDAP para desenvolvimento local, sem AD real (issue #76) —
# inativo por omissão; NUNCA ativar em produção. Quando ativo, substitui
# SpringLdapAutenticador por um stub que compara credenciais diretamente
# contra esta lista fixa, sem protocolo LDAP nenhum.
app.ldap-mock.enabled=${APP_LDAP_MOCK_ENABLED:false}
app.ldap-mock.users[0].username=ana.silva
app.ldap-mock.users[0].password=Senha123!
app.ldap-mock.users[1].username=carlos.tecnico
app.ldap-mock.users[1].password=Senha123!
app.ldap-mock.users[2].username=ana.silva@dgt.pt
app.ldap-mock.users[2].password=Senha123!

app.incm.base-url=${INCM_BASE_URL:}
app.incm.service-key=${INCM_SERVICE_KEY:}
app.incm.connect-timeout=${INCM_CONNECT_TIMEOUT:5s}
app.incm.read-timeout=${INCM_READ_TIMEOUT:30s}
# Consulta diaria do estado dos atos enviados (job consulta-incm). No E2E, INCM_CONSULTA_CRON=0 * * * * * (a cada minuto).
app.incm.consulta.cron=${INCM_CONSULTA_CRON:0 0 6 * * *}
app.incm.consulta.lock-maximo=${INCM_CONSULTA_LOCK_MAXIMO:30m}
app.snit.base-url=${SNIT_BASE_URL:}
app.snit.api-key=${SNIT_API_KEY:}
app.snit.connect-timeout=${SNIT_CONNECT_TIMEOUT:5s}
app.snit.read-timeout=${SNIT_READ_TIMEOUT:10s}
# Sincronizacao diaria da replica das tabelas de referencia do SNIT (job sincronizacao-referencia-snit), as 3h.
# SNIT_REFERENCIA_CRON=- desliga-a; para testar, SNIT_REFERENCIA_CRON=0 * * * * * corre-a a cada minuto. Nao definir
# SNIT_REFERENCIA_CRON vazio, que impede o arranque.
app.snit.referencia.cron=${SNIT_REFERENCIA_CRON:0 0 3 * * *}
app.snit.referencia.lock-maximo=${SNIT_REFERENCIA_LOCK_MAXIMO:30m}
# Com a replica sem concelhos (ambiente novo), sincroniza-a logo ao arrancar.
app.snit.referencia.sincronizar-ao-arrancar=${SNIT_REFERENCIA_SINCRONIZAR_AO_ARRANCAR:true}
# Caixas da pasta de deposito servida ao SNIT (PUBLICACAO, DEPOSITO ou as duas, separadas por virgula).
app.snit.deposito.caixas=${SNIT_DEPOSITO_CAIXAS:DEPOSITO}
# PCGT (API de processos): credenciais so por variavel de ambiente; URL base vazio = nao configurado.
app.pcgt.base-url=${PCGT_BASE_URL:}
app.pcgt.username=${PCGT_USERNAME:}
app.pcgt.password=${PCGT_PASSWORD:}
app.pcgt.connect-timeout=${PCGT_CONNECT_TIMEOUT:5s}
app.pcgt.read-timeout=${PCGT_READ_TIMEOUT:10s}
# GeoConform (API exposta pelo GeoConform): OAuth 2.0 client credentials, com o token so em memoria. Credenciais so
# por variavel de ambiente; URL base, URL do token ou credenciais vazios = nao configurado (nenhum pedido sai).
app.geoconform.base-url=${GEOCONFORM_BASE_URL:}
app.geoconform.token-url=${GEOCONFORM_TOKEN_URL:}
app.geoconform.client-id=${GEOCONFORM_CLIENT_ID:}
app.geoconform.client-secret=${GEOCONFORM_CLIENT_SECRET:}
app.geoconform.connect-timeout=${GEOCONFORM_CONNECT_TIMEOUT:5s}
app.geoconform.read-timeout=${GEOCONFORM_READ_TIMEOUT:10s}
# Verificacao diaria da data de caducidade das Dinamicas (job caducidade-dinamicas), antes da consulta a INCM das 6h.
# Para testar, DINAMICAS_CADUCIDADE_CRON=0 * * * * * corre-o a cada minuto.
app.dinamicas.caducidade.cron=${DINAMICAS_CADUCIDADE_CRON:0 0 5 * * *}
app.dinamicas.caducidade.lock-maximo=${DINAMICAS_CADUCIDADE_LOCK_MAXIMO:30m}
# Verificacao diaria dos processos EM_SUBMISSAO parados (job inatividade-processos): avisos e anulacao, contados
# a partir de atualizado_em, em ISO 8601 (P3M15D = 3 meses e 15 dias). Prazos fora de ordem impedem o arranque.
# Para testar, PROCESSOS_INATIVIDADE_CRON=0 * * * * * corre-o a cada minuto.
app.processos.inatividade.cron=${PROCESSOS_INATIVIDADE_CRON:0 30 5 * * *}
app.processos.inatividade.lock-maximo=${PROCESSOS_INATIVIDADE_LOCK_MAXIMO:30m}
app.processos.inatividade.primeiro-aviso=${PROCESSOS_INATIVIDADE_PRIMEIRO_AVISO:P3M}
app.processos.inatividade.segundo-aviso=${PROCESSOS_INATIVIDADE_SEGUNDO_AVISO:P3M15D}
app.processos.inatividade.anulacao=${PROCESSOS_INATIVIDADE_ANULACAO:P4M}

# Dois Circuit Breakers para a INCM, com a mesma configuração: o login (ValidateUser) tem o seu, o envio
# e a consulta de atos (SubmitNewAct, GetActDetails) partilham outro. Falhas do envio não bloqueiam o login.
resilience4j.circuitbreaker.configs.incm.sliding-window-size=${APP_INCM_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.configs.incm.minimum-number-of-calls=${APP_INCM_CB_MIN_CALLS:5}
resilience4j.circuitbreaker.configs.incm.failure-rate-threshold=${APP_INCM_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.configs.incm.wait-duration-in-open-state=${APP_INCM_CB_WAIT_OPEN:30s}
resilience4j.circuitbreaker.configs.incm.permitted-number-of-calls-in-half-open-state=${APP_INCM_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.incm-autenticacao.base-config=incm
resilience4j.circuitbreaker.instances.incm-submissao.base-config=incm

# Circuit Breakers do SNIT: snit-consulta (pesquisa e detalhe de IGT, tabelas de referencia) e snit-registo
# (registo da publicacao), separados para uma falha nas escritas nao fechar as consultas.
resilience4j.circuitbreaker.configs.snit.sliding-window-size=${APP_SNIT_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.configs.snit.minimum-number-of-calls=${APP_SNIT_CB_MIN_CALLS:5}
resilience4j.circuitbreaker.configs.snit.failure-rate-threshold=${APP_SNIT_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.configs.snit.wait-duration-in-open-state=${APP_SNIT_CB_WAIT_OPEN:30s}
resilience4j.circuitbreaker.configs.snit.permitted-number-of-calls-in-half-open-state=${APP_SNIT_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.snit-consulta.base-config=snit
# Os 4xx do registo (pedido invalido, credenciais, 409 de outro diploma) nao sao indisponibilidade do SNIT.
resilience4j.circuitbreaker.instances.snit-registo.base-config=snit
resilience4j.circuitbreaker.instances.snit-registo.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# Circuit Breakers da PCGT e do GeoConform, prontos para os clientes destes sistemas.
resilience4j.circuitbreaker.configs.pcgt.sliding-window-size=${APP_PCGT_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.configs.pcgt.minimum-number-of-calls=${APP_PCGT_CB_MIN_CALLS:5}
resilience4j.circuitbreaker.configs.pcgt.failure-rate-threshold=${APP_PCGT_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.configs.pcgt.wait-duration-in-open-state=${APP_PCGT_CB_WAIT_OPEN:30s}
resilience4j.circuitbreaker.configs.pcgt.permitted-number-of-calls-in-half-open-state=${APP_PCGT_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.pcgt.base-config=pcgt
resilience4j.circuitbreaker.instances.pcgt.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
# Limite da PCGT: 300 pedidos/min por utilizador. E por instancia: com N instancias da API, dividir por N.
resilience4j.ratelimiter.instances.pcgt.limit-for-period=${APP_PCGT_RATE_LIMIT:300}
resilience4j.ratelimiter.instances.pcgt.limit-refresh-period=1m
resilience4j.ratelimiter.instances.pcgt.timeout-duration=${APP_PCGT_RATE_LIMIT_ESPERA:1m}
resilience4j.circuitbreaker.configs.geoconform.sliding-window-size=${APP_GEOCONFORM_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.configs.geoconform.minimum-number-of-calls=${APP_GEOCONFORM_CB_MIN_CALLS:5}
resilience4j.circuitbreaker.configs.geoconform.failure-rate-threshold=${APP_GEOCONFORM_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.configs.geoconform.wait-duration-in-open-state=${APP_GEOCONFORM_CB_WAIT_OPEN:30s}
resilience4j.circuitbreaker.configs.geoconform.permitted-number-of-calls-in-half-open-state=${APP_GEOCONFORM_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.geoconform.base-config=geoconform
# Os 4xx (pedido invalido, ambito em falta, processo ja existente) nao sao indisponibilidade do GeoConform.
resilience4j.circuitbreaker.instances.geoconform.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
# Sem default: o arranque falha se faltarem as credenciais.
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.bucket=${STORAGE_BUCKET:saigt-documentos}
# Cria o bucket no arranque se nao existir; o rustfs-init so cobre o compose de desenvolvimento.
app.storage.inicializar-bucket=${STORAGE_INICIALIZAR_BUCKET:true}
# TR-009: o bucket tem de ter Object Lock; sem ele o arranque falha. A false, so regista um aviso.
app.storage.object-lock-obrigatorio=${APP_STORAGE_OBJECT_LOCK_OBRIGATORIO:true}

# O corpo dos uploads de documentos e lido em streaming (LeitorUploadDocumento); o multipart do Spring grava-o em
# disco antes de o controlador o ver, por isso fica desligado. So os documentos usam multipart.
spring.servlet.multipart.enabled=false
# Sem teto global por ficheiro: os limites de tamanho sao os do item (documento_config) e do Procedimento
# (instrumento_procedimento_config). O reverse proxy tem de aceitar pedidos acima do maior limite por ficheiro.
# Tamanho de cada parte do upload para o storage (minimo 5MiB, exigencia do S3). E a memoria que cada upload em
# curso ocupa no backend: o corpo nunca vai para disco.
app.documentos.tamanho-parte=${APP_DOCUMENTOS_TAMANHO_PARTE:10MB}
# Descarga por ticket HMAC (TR-107). chaves = id:segredo (virgula separa varias, para rotacao); a chave ativa assina e
# todas validam. Sem default: o arranque falha se faltarem. O ticket nunca vai para o log nem para a BD.
app.documentos.descarga.chaves=${APP_DOCUMENTOS_DESCARGA_CHAVES:}
app.documentos.descarga.chave-ativa=${APP_DOCUMENTOS_DESCARGA_CHAVE_ATIVA:}
app.documentos.descarga.ticket-validade=${APP_DOCUMENTOS_DESCARGA_TICKET_VALIDADE:60s}
app.documentos.descarga.limite-simultaneas=${APP_DOCUMENTOS_DESCARGA_LIMITE_SIMULTANEAS:50}
# Descargas em simultaneo por token de link publico (INCM, PCGT).
app.documentos.descarga.limite-por-token=${APP_DOCUMENTOS_DESCARGA_LIMITE_POR_TOKEN:3}
# Descargas em simultaneo por cliente do SNIT (BL-DOC-029: 5 por cliente), dentro do limite global.
app.documentos.descarga.limite-por-cliente-snit=${APP_DOCUMENTOS_DESCARGA_LIMITE_POR_CLIENTE_SNIT:5}
app.documentos.descarga.retry-after=${APP_DOCUMENTOS_DESCARGA_RETRY_AFTER:5s}
# Prazo do IP na auditoria das descargas (RGPD, a validar); o resto da linha mantem-se.
app.documentos.descarga.retencao-ip=${APP_DOCUMENTOS_DESCARGA_RETENCAO_IP:12m}
app.documentos.descarga.purga-ip.cron=${APP_DOCUMENTOS_DESCARGA_PURGA_IP_CRON:0 0 4 * * *}
app.documentos.descarga.purga-ip.lock-maximo=${APP_DOCUMENTOS_DESCARGA_PURGA_IP_LOCK_MAXIMO:1h}
# Tempos limite do cliente do storage; a leitura parada 60s sem dados e cortada.
app.storage.timeout-ligacao=${STORAGE_TIMEOUT_LIGACAO:10s}
app.storage.timeout-sem-dados=${STORAGE_TIMEOUT_SEM_DADOS:60s}
# Endereco publico da saigt-api: base do URL do ticket e dos links enviados a terceiros.
app.publico.base-url=${APP_PUBLICO_BASE_URL:http://localhost:8080}
# Threads virtuais: cada descarga em streaming ocupa uma thread durante todo o envio.
spring.threads.virtual.enabled=true
# Limpeza noturna do storage pelas intencoes registadas (BL-DOC-009). So trata as intencoes com mais da idade
# minima, para nao apanhar operacoes em curso; nunca lista o bucket nem apaga versoes retidas.
app.documentos.limpeza.cron=${APP_DOCUMENTOS_LIMPEZA_CRON:0 30 3 * * *}
app.documentos.limpeza.idade-minima=${APP_DOCUMENTOS_LIMPEZA_IDADE_MINIMA:24h}
app.documentos.limpeza.lock-maximo=${APP_DOCUMENTOS_LIMPEZA_LOCK_MAXIMO:2h}
# Anexos de notificacao: nao tem item documental, por isso o limite por ficheiro e as extensoes sao estes, com os
# valores por omissao dos ficheiros de processo (500MB por ficheiro, pecas escritas). Sem teto global de tamanho.
app.notificacoes.anexos.tamanho-maximo=${APP_NOTIFICACOES_ANEXOS_TAMANHO_MAXIMO:500MB}
app.notificacoes.anexos.extensoes-aceites=${APP_NOTIFICACOES_ANEXOS_EXTENSOES:pdf,doc,docx,rtf,odf,odt,xls,xlsx,csv,ods,txt}

# Exportacao das listagens de processos (PDF/Excel, sincrona): acima deste n.o de linhas recusa, nao trunca.
# Valor provisorio ate haver valor inicial decidido e edicao no BackOffice.
app.exportacao.limite-linhas=${APP_EXPORTACAO_LIMITE_LINHAS:5000}
# Prazo da retencao GOVERNANCE dos ficheiros validados e publicados (BL-DOC-009): data limite a confirmar com a DGT
# (TR-009).
app.documentos.retencao.anos=${APP_DOCUMENTOS_RETENCAO_ANOS:100}
# Repeticao da retencao dos processos do registo externo que nascem PUBLICADO, quando a retencao depois do commit
# falhou (job retencao-registo-externo). Idempotente: as versoes ja retidas nao sao tocadas.
app.documentos.retencao.repeticao.cron=${APP_DOCUMENTOS_RETENCAO_REPETICAO_CRON:0 15 * * * *}
app.documentos.retencao.repeticao.lock-maximo=${APP_DOCUMENTOS_RETENCAO_REPETICAO_LOCK_MAXIMO:30m}
# Inspecao dos GeoTIFF das pecas graficas de deposito (gdal-tools na imagem): executavel e tempo maximo de cada
# inspecao; passado o tempo o processo e morto e o ficheiro nao e aceite.
app.documentos.tiff.gdalinfo=${APP_TIFF_GDALINFO:gdalinfo}
app.documentos.tiff.timeout=${APP_TIFF_TIMEOUT:60s}
# o lock fica ocupado pelo menos este tempo, para outra instancia cujo cron
# dispara uns instantes depois nao repetir um job rapido. Tem de ser menor do que o intervalo de cada cron.
app.jobs.lock-minimo=${APP_JOBS_LOCK_MINIMO:30s}

management.endpoints.web.exposure.include=health,info,prometheus
# O health e publico: nunca mostra o estado da BD, do disco ou de outros componentes.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# O login liga-se ao AD por app.ldap.url; o LdapContextSource do Spring, que este indicador testa, aponta para
# localhost:389 e nao e usado. Uma falha do AD tambem nao deve tirar a API de servico.
management.health.ldap.enabled=false
management.tracing.sampling.probability=1.0
management.zipkin.tracing.enabled=false

springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/api/v1/docs

# Formato do log em logback-spring.xml (JSON na saida padrao). O banner sairia fora do JSON.
spring.main.banner-mode=off

# Cópia de cortesia das notificações por email, enviada depois do commit (a notificação é a via autoritativa).
# Desligada por omissão; ligada, o arranque falha sem remetente.
app.notificacoes.email.ativo=${APP_NOTIFICACOES_EMAIL_ATIVO:false}
app.notificacoes.email.remetente=${APP_NOTIFICACOES_EMAIL_REMETENTE:}
# Executor próprio (threads notif-email-*): com a fila cheia a cópia é recusada com um WARN, sem bloquear o pedido.
app.notificacoes.email.executor.tamanho-base=${APP_NOTIFICACOES_EMAIL_EXECUTOR_TAMANHO_BASE:1}
app.notificacoes.email.executor.tamanho-maximo=${APP_NOTIFICACOES_EMAIL_EXECUTOR_TAMANHO_MAXIMO:2}
app.notificacoes.email.executor.fila=${APP_NOTIFICACOES_EMAIL_EXECUTOR_FILA:500}
# Relay SMTP por ambiente. Utilizador e palavra-passe são segredos de runtime, nunca deste ficheiro.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
# Tempos limite em ms: um relay parado não pode prender as threads do executor de email.
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:10000}
# O email não é a via autoritativa: o relay indisponível não põe a API como não saudável.
management.health.mail.enabled=false
