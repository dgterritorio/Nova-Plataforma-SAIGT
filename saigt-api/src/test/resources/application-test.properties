spring.datasource.url=jdbc:h2:mem:saigt-${random.uuid};MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false
app.security.auth-disabled=true
app.storage.access-key=saigt-teste
app.storage.secret-key=saigt-teste-segredo
# Sem storage nos testes em H2; StorageTestcontainersBase volta a ligar.
app.storage.inicializar-bucket=false
app.snit.referencia.sincronizar-ao-arrancar=false
app.documentos.descarga.chaves=teste:chave-de-teste-com-mais-de-32-bytes-xxxxxxxx
app.documentos.descarga.chave-ativa=teste
# Sem AD nos testes, o LdapHealthIndicator poria o health em DOWN.
management.health.ldap.enabled=false
