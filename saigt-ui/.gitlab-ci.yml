# Pipeline do saigt-ui: lint, testes e build de produção nos merge requests, build da imagem e publicação no
# registry nos ramos develop, staging e master, e deploy manual da imagem publicada no ambiente de cada ramo.
# Os jobs imagem e publicar precisam de um runner com executor docker em modo privilegiado e o volume /certs/client
# (Docker-in-Docker com TLS); os de deploy só de um cliente SSH.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Ramos de longa duração: sempre pipeline de ramo, mesmo com um MR de promoção aberto (develop → staging).
    - if: $CI_COMMIT_BRANCH =~ /^(develop|staging|master)$/
    # Um ramo com MR aberto corre só o pipeline do MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: never

stages:
  - verificacao
  - build
  - imagem
  - deploy

default:
  interruptible: true

# Node da imagem do Dockerfile. O GitLab só guarda em cache pastas dentro do projeto, daí o --cache .npm.
.node:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

# Docker-in-Docker com TLS, como recomenda a documentação do GitLab. Versão fixa: o mesmo número na imagem e no serviço.
.docker-dind:
  services:
    - name: docker:29.9.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"

lint:
  extends: .node
  stage: verificacao
  script:
    - npm run lint

# Com CI=true (o GitLab define-o), o forbidOnly da e2e/playwright.config.ts faz falhar um test.only esquecido.
testes:
  extends: .node
  stage: verificacao
  script:
    - npm run test -- --watch=false --reporters=default --reporters=junit --output-file=relatorios/junit/unitarios.xml
    - npm run e2e:harness
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - e2e/relatorios/playwright/
    reports:
      junit:
        - relatorios/junit/unitarios.xml
        - e2e/relatorios/junit/harness.xml

build:
  extends: .node
  stage: build
  needs: [lint, testes]
  script:
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - dist/saigt-ui/browser/

# O Dockerfile compila a aplicação de raiz, sem o artefacto do build.
.imagem:
  extends: .docker-dind
  stage: imagem
  image: docker:29.9.2
  needs:
    - job: build
      artifacts: false

# Merge requests: confirma que o Dockerfile constrói. Sem login nem push: o código por integrar não chega ao
# registry e as credenciais não ficam ao alcance dos ramos de feature.
imagem:
  extends: .imagem
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build -t "saigt-ui:$CI_COMMIT_SHORT_SHA" .

# Pipelines de ramo de develop, staging e master: publica a imagem de produção com a etiqueta do commit, a
# referência imutável do deploy. O registry e as credenciais vêm das variáveis de CI/CD (as predefinidas do
# Container Registry do GitLab, ou as do projeto com os mesmos nomes, protegidas e mascaradas, para outro registry).
publicar:
  extends: .imagem
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^(develop|staging|master)$/
  variables:
    IMAGEM: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - '[ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_IMAGE" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] || { echo "Faltam variáveis de CI/CD do registry (CI_REGISTRY, CI_REGISTRY_IMAGE, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD)."; exit 1; }'
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # A etiqueta de um commit nunca se sobrescreve: num pipeline repetido, ou com o mesmo commit promovido a
    # staging ou master, fica a imagem que já lá está.
    - if docker manifest inspect "$IMAGEM" > /dev/null 2>&1; then echo "A imagem $IMAGEM já está no registry; não se sobrescreve."; exit 0; fi
    - docker build --build-arg BUILD_CONFIG=production -t "$IMAGEM" .
    - docker push "$IMAGEM"

# Deploy num ambiente: cada ambiente tem, num servidor, o seu docker-compose.yml e o seu .env com os segredos de
# runtime, geridos fora dos repositórios. O job liga-se por SSH à pasta do ambiente, indica a imagem nova do saigt-ui
# (na variável SAIGT_UI_IMAGEM, só no ambiente do comando), faz pull e up -d só desse serviço e espera que a página
# inicial responda com 200. Nunca escreve no .env. Endereços, pasta, chave e known_hosts vêm de variáveis de CI/CD
# com o âmbito do ambiente; o registry e as credenciais do pull, das mesmas variáveis do publicar.
.deploy:
  stage: deploy
  image: docker:29.9.2
  needs:
    - job: publicar
      artifacts: false
  # Um deploy a meio não se cancela com um push mais recente.
  interruptible: false
  variables:
    SERVICO: saigt-ui
    VARIAVEL_IMAGEM: SAIGT_UI_IMAGEM
    IMAGEM: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Valores por omissão; uma variável de CI/CD com o mesmo nome (do ambiente) sobrepõe-se.
    DEPLOY_SSH_PORT: "22"
    DEPLOY_TEMPO_LIMITE: "120"
    DEPLOY_LINHAS_LOG: "100"
  before_script:
    - '[ -n "$DEPLOY_SSH_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] && [ -n "$DEPLOY_DIR" ] && [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] || { echo "Faltam variáveis de CI/CD do ambiente $CI_ENVIRONMENT_NAME (DEPLOY_SSH_HOST, DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS, DEPLOY_DIR) ou do registry (CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD)."; exit 1; }'
    - '[ -f "$DEPLOY_SSH_KEY" ] && [ -f "$DEPLOY_SSH_KNOWN_HOSTS" ] || { echo "DEPLOY_SSH_KEY e DEPLOY_SSH_KNOWN_HOSTS têm de ser variáveis de CI/CD do tipo File."; exit 1; }'
    # A chave do host do ambiente é sempre verificada contra o known_hosts da variável (StrictHostKeyChecking=yes).
    - install -d -m 700 "$HOME/.ssh" && tr -d '\r' < "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy" && chmod 600 "$HOME/.ssh/deploy" && tr -d '\r' < "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
    - |
      remoto() {
        ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
          -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy" -p "$DEPLOY_SSH_PORT" "$DEPLOY_SSH_HOST" "$@"
      }
      aspas() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/'\\\\''/g")"; }
      # Corre na pasta do ambiente o script lido do stdin.
      no_ambiente() {
        remoto "cd $(aspas "$DEPLOY_DIR") && export $VARIAVEL_IMAGEM=$(aspas "$IMAGEM") IMAGEM_ESPERADA=$(aspas "$IMAGEM") SERVICO=$(aspas "$SERVICO") LINHAS_LOG=$(aspas "$DEPLOY_LINHAS_LOG") && sh -s"
      }
      # Estado dos contentores do serviço: ok (a página inicial responde com 200 dentro do contentor), espera ou
      # «falha: <motivo>». Um contentor parado ou a reiniciar falha logo.
      VERIFICAR='
      ids=$(docker compose ps -a -q "$SERVICO")
      [ -n "$ids" ] || { echo "falha: não há contentores do $SERVICO"; exit 0; }
      res=ok
      for c in $ids; do
        set -- $(docker inspect --format "{{.Name}} {{.Config.Image}} {{.State.Status}} {{.RestartCount}}" "$c")
        if [ "$2" != "$IMAGEM_ESPERADA" ]; then echo "falha: $1 corre $2"; exit 0; fi
        if [ "$3" != running ] || [ "$4" != 0 ]; then echo "falha: $1 está $3, com $4 reinícios"; exit 0; fi
        docker exec "$c" wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q "HTTP/1.1 200" || res=espera
      done
      echo "$res"
      '
      RESUMO='
      for c in $(docker compose ps -q "$SERVICO"); do
        echo "$(docker inspect --format "{{.Name}} {{.Config.Image}} {{.State.Status}}" "$c") página inicial: $(docker exec "$c" wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -m1 "HTTP/")"
      done
      '
      LOGS='docker compose logs --no-color --tail "$LINHAS_LOG" "$SERVICO"'
  script:
    - echo "Deploy de $IMAGEM ($SERVICO) no ambiente $CI_ENVIRONMENT_NAME."
    # Login no registry pelo stdin, no servidor do ambiente, e logout logo a seguir ao pull.
    - printf '%s' "$CI_REGISTRY_PASSWORD" | remoto "docker login --username $(aspas "$CI_REGISTRY_USER") --password-stdin $(aspas "$CI_REGISTRY")"
    - |
      rc=0
      echo 'docker compose pull --quiet "$SERVICO"' | no_ambiente || rc=$?
      remoto "docker logout $(aspas "$CI_REGISTRY")" > /dev/null || true
      [ "$rc" -eq 0 ] || { echo "O pull de $IMAGEM falhou. Nada mudou no ambiente."; exit 1; }
    # Recria sempre o serviço, também com a mesma imagem: repetir o deploy volta a arrancar o saigt-ui.
    - echo 'docker compose up -d --no-deps --force-recreate "$SERVICO"' | no_ambiente
    - |
      inicio=$(date +%s); motivo=""
      while :; do
        estado=$(printf '%s\n' "$VERIFICAR" | no_ambiente) || estado="espera (SSH falhou)"
        decorrido=$(( $(date +%s) - inicio ))
        case "$estado" in
          ok) break ;;
          falha*) motivo=${estado#falha: }; break ;;
        esac
        if [ "$decorrido" -ge "$DEPLOY_TEMPO_LIMITE" ]; then motivo="passaram ${DEPLOY_TEMPO_LIMITE}s sem a página inicial do $SERVICO responder com 200 ($estado)"; break; fi
        sleep 5
      done
      if [ -n "$motivo" ]; then
        echo "Deploy falhou ao fim de ${decorrido}s: $motivo. Últimas $DEPLOY_LINHAS_LOG linhas do log do $SERVICO:"
        printf '%s\n' "$LOGS" | no_ambiente || true
        exit 1
      fi
      echo "A página inicial do $SERVICO respondeu com 200 ao fim de ${decorrido}s no ambiente $CI_ENVIRONMENT_NAME:"
      printf '%s\n' "$RESUMO" | no_ambiente

# Um job manual por ambiente, só nos pipelines de ramo e só em ramos protegidos (as variáveis protegidas do ambiente só
# chegam aí): develop → desenvolvimento, staging → qualidade, master → produção. O nome do ambiente no GitLab é a
# chave das variáveis com âmbito de ambiente; o endereço vem da variável DEPLOY_URL desse ambiente.
deploy-desenvolvimento:
  extends: .deploy
  resource_group: deploy-desenvolvimento
  environment:
    name: desenvolvimento
    url: $DEPLOY_URL
    deployment_tier: development
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop"
      when: manual

deploy-qualidade:
  extends: .deploy
  resource_group: deploy-qualidade
  environment:
    name: qualidade
    url: $DEPLOY_URL
    deployment_tier: staging
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "staging"
      when: manual

deploy-producao:
  extends: .deploy
  resource_group: deploy-producao
  environment:
    name: producao
    url: $DEPLOY_URL
    deployment_tier: production
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "master"
      when: manual
