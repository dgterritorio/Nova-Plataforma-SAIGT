server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Só os endpoints de tokens e de revogação do servidor de autorização; o resto de /oauth2 não passa por aqui.
    location = /oauth2/token {
        proxy_http_version 1.1;
        proxy_pass http://saigt-api:8080/oauth2/token;
    }

    location = /oauth2/revoke {
        proxy_http_version 1.1;
        proxy_pass http://saigt-api:8080/oauth2/revoke;
    }

    location /api/ {
        # Acima do maior tamanho_maximo_ficheiro dos itens (500 MB), com margem para o envelope multipart, para ser a
        # API a recusar com DOC_TAMANHO_EXCEDIDO. Rever se algum item passar de 500 MB.
        client_max_body_size 520m;
        # O upload segue para a API em streaming, sem o nginx o guardar primeiro.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://saigt-api:8080/api/;
    }
}
