<app-modal [titulo]="titulo()" [subtitulo]="dinamica()" largura="md" [aberto]="aberto()" (fechar)="fechar.emit()">
  <form class="formulario" [id]="idFormulario" [formGroup]="formulario" (ngSubmit)="submeter()" novalidate>
    @if (erroGeral(); as erro) {
      <app-alerta tipo="erro" titulo="Não foi possível gravar o Procedimento.">{{ erro.mensagem }}</app-alerta>
    }
    @if (!procedimento()) {
      <app-alerta tipo="info">Depois de criar, configure as permissões e os itens documentais deste Procedimento.</app-alerta>
    }
    <app-seletor
      formControlName="tipoProcedimentoId"
      rotulo="Tipo de Procedimento"
      [obrigatorio]="true"
      [compacto]="true"
      [opcoes]="opcoesTipo()"
      [ajuda]="ajudaTipo()"
      [erro]="erroDoCampo('tipoProcedimentoId')"
    />
    @if (semFormulario()) {
      <app-alerta tipo="aviso">{{ avisoSemFormulario }}</app-alerta>
    }
    <div class="linha-campos">
      <app-campo-texto
        formControlName="ordem"
        rotulo="Ordem"
        tipo="number"
        [obrigatorio]="true"
        [compacto]="true"
        [erro]="erroDoCampo('ordem')"
      />
      <app-seletor
        formControlName="serieDr"
        rotulo="Série do DR"
        [obrigatorio]="true"
        [compacto]="true"
        [opcoes]="opcoesSerie"
        [erro]="erroDoCampo('serieDr')"
      />
    </div>
    <app-campo-texto
      formControlName="tamanhoMaximoProcesso"
      rotulo="Limite agregado do processo (MB)"
      tipo="number"
      ajuda="Vazio = sem limite. Valor de omissão do legado: 5120 MB."
      [compacto]="true"
      [erro]="erroDoCampo('tamanhoMaximoProcesso')"
    />
    <div class="caixas">
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="obrigatorio" />
        Obrigatório
      </label>
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="repetivel" />
        Repetível em sequência
      </label>
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="atoPontual" />
        Ato pontual (fora do sequenciamento)
      </label>
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="visivelNaDinamica" />
        Visível, só em leitura, às entidades com processos na mesma Dinâmica
      </label>
    </div>
  </form>
  <div rodape>
    <button type="button" app-botao variante="secundario" tamanho="pequeno" (click)="fechar.emit()">Cancelar</button>
    <button type="submit" app-botao tamanho="pequeno" [attr.form]="idFormulario" [aCarregar]="aGravar()" [desativado]="formulario.invalid">
      Guardar
    </button>
  </div>
</app-modal>
