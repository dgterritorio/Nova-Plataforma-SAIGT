<app-modal [titulo]="titulo()" subtitulo="Redes de defesa do SGIFR" largura="md" [aberto]="aberto()" (fechar)="fechar.emit()">
  <form class="formulario" [id]="idFormulario" [formGroup]="formulario" (ngSubmit)="submeter()" novalidate>
    @if (erroGeral(); as erro) {
      <app-alerta tipo="erro" titulo="Não foi possível gravar a rede.">{{ erro.mensagem }}</app-alerta>
    }
    @for (erro of errosDasCaixas(); track erro) {
      <app-alerta tipo="erro">{{ erro }}</app-alerta>
    }
    <app-campo-texto
      formControlName="codigo"
      rotulo="Código"
      ajuda="Ex.: RVF"
      [obrigatorio]="true"
      [compacto]="true"
      [maxlength]="tamanhoMaximoCodigo"
      [erro]="erroDoCampo('codigo')"
    />
    <app-campo-texto
      formControlName="nome"
      rotulo="Nome"
      [obrigatorio]="true"
      [compacto]="true"
      [maxlength]="tamanhoMaximoNome"
      [erro]="erroDoCampo('nome')"
    />
    <div class="caixas">
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="aplicaPra" />
        Aplica-se ao PRA
      </label>
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="aplicaPsa" />
        Aplica-se ao PSA
      </label>
      <label class="caixa-verificacao">
        <input type="checkbox" formControlName="publicavel" />
        Publicável
      </label>
    </div>
  </form>
  <div rodape>
    <button type="button" app-botao variante="secundario" tamanho="pequeno" (click)="fechar.emit()">Cancelar</button>
    <button type="submit" app-botao tamanho="pequeno" [attr.form]="idFormulario" [aCarregar]="aGravar()" [desativado]="formulario.invalid">
      Guardar
    </button>
  </div>
</app-modal>
