<app-modal [titulo]="titulo()" subtitulo="Tipos de ato" largura="md" [aberto]="aberto()" (fechar)="fechar.emit()">
  <form class="formulario" [id]="idFormulario" [formGroup]="formulario" (ngSubmit)="submeter()" novalidate>
    @if (erroGeral(); as erro) {
      <app-alerta tipo="erro" titulo="Não foi possível gravar o tipo de ato.">{{ erro.mensagem }}</app-alerta>
    }
    <p class="so-leitor" role="alert">{{ semSerie() ? erroSemSerie : '' }}</p>
    <app-campo-texto
      formControlName="codigo"
      rotulo="Código"
      ajuda="Ex.: DELIB"
      [obrigatorio]="true"
      [compacto]="true"
      [maxlength]="tamanhoMaximoCodigo"
      [erro]="erroDoCampo('codigo')"
    />
    <app-campo-texto
      formControlName="nome"
      rotulo="Nome"
      [obrigatorio]="true"
      [compacto]="true"
      [maxlength]="tamanhoMaximoNome"
      [erro]="erroDoCampo('nome')"
    />
    <div class="linha-campos">
      <app-campo-texto
        formControlName="incmActTypeIdSerie1"
        rotulo="ActTypeId da INCM — 1.ª série"
        tipo="number"
        [compacto]="true"
        [erro]="erroDoCampo('incmActTypeIdSerie1')"
      />
      <app-campo-texto
        formControlName="incmActTypeIdSerie2"
        rotulo="ActTypeId da INCM — 2.ª série"
        tipo="number"
        [compacto]="true"
        [erro]="erroDoCampo('incmActTypeIdSerie2')"
      />
    </div>
    <app-campo-texto formControlName="ordem" rotulo="Ordem" tipo="number" [obrigatorio]="true" [compacto]="true" [erro]="erroDoCampo('ordem')" />
  </form>
  <div rodape>
    <button type="button" app-botao variante="secundario" tamanho="pequeno" (click)="fechar.emit()">Cancelar</button>
    <button type="submit" app-botao tamanho="pequeno" [attr.form]="idFormulario" [aCarregar]="aGravar()">Guardar</button>
  </div>
</app-modal>
