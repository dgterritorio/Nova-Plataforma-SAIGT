<app-modal titulo="Enviar PCM" [aberto]="aberto()" largura="md" (fechar)="fechar.emit()">
  <div class="corpo">
    <p class="contexto">O processo fica atribuído ao utilizador da PCM escolhido e continua Validado DGT.</p>

    <app-seletor
      data-campo="utilizador-pcm"
      [compacto]="true"
      rotulo="Utilizador da PCM"
      [obrigatorio]="true"
      [opcoes]="opcoes()"
      [placeholder]="placeholder()"
      [erro]="erroUtilizador()"
      [descritoPorAdicional]="semCandidatos() ? idAvisoSemCandidatos : null"
      [formControl]="controloUtilizador"
    />

    <!-- A região existe sempre: só assim o leitor de ecrã anuncia o aviso quando aparece. -->
    <div aria-live="polite">
      @if (semCandidatos()) {
        <app-alerta tipo="info" [id]="idAvisoSemCandidatos">Não há utilizadores da PCM disponíveis.</app-alerta>
      }
    </div>

    <app-error-banner [erro]="erroBanner()" [mensagemDoServidor]="true" />
    @if (falhaCandidatosPcm()) {
      <button type="button" app-botao variante="secundario" tamanho="pequeno" class="recarregar" (click)="carregarCandidatosPcm()">
        Tentar novamente
      </button>
    }
    @if (conflito()) {
      <button type="button" app-botao variante="secundario" tamanho="pequeno" class="recarregar" (click)="recarregar.emit()">
        Recarregar
      </button>
    }
  </div>

  <div rodape class="acoes">
    <button type="button" app-botao variante="secundario" tamanho="pequeno" (click)="fechar.emit()">Cancelar</button>
    <button type="button" app-botao tamanho="pequeno" class="confirmar" [desativado]="!podeConfirmar()" (click)="confirmar()">
      {{ aProcessar() ? 'A processar…' : 'Confirmar' }}
    </button>
  </div>
</app-modal>
