<svg class="campo-pesquisa-lupa" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
  <circle cx="7" cy="7" r="4.75" />
  <path d="M10.5 10.5 14 14" stroke-linecap="round" />
</svg>
<input
  type="search"
  role="searchbox"
  class="campo-pesquisa-entrada"

  (blur)="tocar()"
/>
